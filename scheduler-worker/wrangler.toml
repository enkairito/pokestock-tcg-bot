name = "pokestock-scheduler"
main = "worker.js"
compatibility_date = "2026-09-10"

# Referencia si algún día se despliega por CLI (wrangler deploy) en vez de
# pegando el código en el panel. Por ahora se gestiona todo desde el panel
# de Cloudflare — ver README.md.
[triggers]
crons = [
  "*/20 * * * *",
  "5 * * * *",
  "15 */6 * * *",
  "30 */2 * * *",
  "0 6 * * *",
]

# El binding tiene que vivir AQUÍ, no solo añadirse a mano en el panel —
# este proyecto se despliega vía Git (Cloudflare ejecuta "wrangler deploy"
# en cada push), y ese comando aplica la config de este archivo tal cual,
# borrando cualquier binding añadido manualmente que no esté declarado aquí.
# El secreto en sí (el valor del token) vive en el Secrets Store de la
# cuenta, no en este archivo ni en el repo — esto solo lo referencia por ID.
[[secrets_store_secrets]]
binding = "GITHUB_TOKEN"
store_id = "2cd943ffacbe4b638a88edad529a1bcf"
secret_name = "GITHUB_TOKEN"
