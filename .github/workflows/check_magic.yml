name: Check Magic TCG Stock

on:
  schedule:
    # Cada 6 horas — pedido explícitamente (2026-09-07): Magic no necesita
    # la misma cadencia horaria que Pokémon/One Piece.
    - cron: '15 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-magic
  cancel-in-progress: false

jobs:
  check-magic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi

      - name: Run Magic TCG check
        env:
          # check_stock.py (importado por check_magic.py) requiere estas dos
          # al cargarse, aunque los avisos reales de Magic usan el bot/canal
          # propio de abajo.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAGIC_BOT_TOKEN: ${{ secrets.TELEGRAM_MAGIC_BOT_TOKEN }}
          TELEGRAM_MAGIC_CHAT_ID: ${{ secrets.TELEGRAM_MAGIC_CHAT_ID }}
        run: xvfb-run -a python check_magic.py

      - name: Publish products snapshot to Where's That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          if [ -f magic_snapshot.json ]; then
            git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock

            cp magic_snapshot.json /tmp/wheresthatstock/magic.json

            python update_sitemap_lastmod.py --sitemap /tmp/wheresthatstock/sitemap.xml

            cd /tmp/wheresthatstock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add magic.json sitemap.xml
            if git diff --cached --quiet; then
              echo "No changes to publish"
            else
              git commit -m "chore: update magic snapshot"
              for i in 1 2 3; do
                git push && break
                echo "Push rejected, pulling and retrying ($i/3)..."
                git pull --rebase
              done
            fi
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_magic.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update magic state"
            for i in 1 2 3; do
              git push && break
              echo "Push rejected, pulling and retrying ($i/3)..."
              git pull --rebase
            done
          fi
