name: Check One Piece TCG Stock

on:
  schedule:
    # Every hour, 5 min offset from the Pokémon check to avoid hitting
    # Amazon/GitHub runners at the exact same minute.
    - cron: '5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-onepiece
  cancel-in-progress: false

jobs:
  check-onepiece:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi

      - name: Run One Piece TCG check
        env:
          # check_stock.py (importado por check_onepiece.py) requiere estas
          # dos al cargarse, aunque los avisos reales de One Piece usan las
          # otras dos de abajo (bot y canal propios).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ONEPIECE_BOT_TOKEN: ${{ secrets.TELEGRAM_ONEPIECE_BOT_TOKEN }}
          TELEGRAM_ONEPIECE_CHAT_ID: ${{ secrets.TELEGRAM_ONEPIECE_CHAT_ID }}
        run: xvfb-run -a python check_onepiece.py

      - name: Commit updated state
        run: >-
          python publish_updates.py --repo . --message "chore: update onepiece state" --copy state_onepiece.json state_onepiece.json

      - name: Publish products snapshot to Wheres That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock
          python publish_updates.py --repo /tmp/wheresthatstock --message "chore: update onepiece snapshot" --copy onepiece_snapshot.json onepiece.json --sitemap --accessories accesorios_onepiece_snapshot.json --source onepiece
