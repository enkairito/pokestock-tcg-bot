name: Check One Piece TCG Stock

on:
  schedule:
    # Every hour, 5 min offset from the Pokémon check to avoid hitting
    # Amazon/GitHub runners at the exact same minute.
    - cron: '5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-onepiece
  cancel-in-progress: false

jobs:
  check-onepiece:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi

      - name: Run One Piece TCG check
        env:
          # check_stock.py (importado por check_onepiece.py) requiere estas
          # dos al cargarse, aunque los avisos reales de One Piece usan las
          # otras dos de abajo (bot y canal propios).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ONEPIECE_BOT_TOKEN: ${{ secrets.TELEGRAM_ONEPIECE_BOT_TOKEN }}
          TELEGRAM_ONEPIECE_CHAT_ID: ${{ secrets.TELEGRAM_ONEPIECE_CHAT_ID }}
        run: xvfb-run -a python check_onepiece.py

      - name: Publish products snapshot to Where's That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          if [ -f onepiece_snapshot.json ]; then
            git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock

            cp onepiece_snapshot.json /tmp/wheresthatstock/onepiece.json

            if [ -f accesorios_onepiece_snapshot.json ]; then
              python merge_accesorios.py --base /tmp/wheresthatstock/accesorios.json --new accesorios_onepiece_snapshot.json --out /tmp/wheresthatstock/accesorios.json --source onepiece
            fi

            python update_sitemap_lastmod.py --sitemap /tmp/wheresthatstock/sitemap.xml

            cd /tmp/wheresthatstock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add onepiece.json accesorios.json sitemap.xml
            if git diff --cached --quiet; then
              echo "No changes to publish"
            else
              git commit -m "chore: update one piece snapshot"
              for i in 1 2 3; do
                git push && break
                echo "Push rejected, pulling and retrying ($i/3)..."
                git pull --rebase
              done
            fi
          fi

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_onepiece.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update one piece state"
            for i in 1 2 3; do
              git push && break
              echo "Push rejected, pulling and retrying ($i/3)..."
              git pull --rebase
            done
          fi
