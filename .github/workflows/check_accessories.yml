name: Check TCG Accessories Stock

on:
  schedule:
    # Una vez al día — a diferencia del stock de TCG, los accesorios no
    # generan avisos de Telegram, así que no hace falta más frecuencia.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-accessories
  cancel-in-progress: false

jobs:
  check-accessories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi

      - name: Run accessories check
        env:
          # check_stock.py (importado por check_accessories.py) requiere
          # estas variables al cargarse, aunque este script nunca envía
          # nada a Telegram.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python check_accessories.py

      - name: Commit updated state
        run: >-
          python publish_updates.py --repo . --message "chore: update accessories state" --copy state_accesorios.json state_accesorios.json

      - name: Publish products snapshot to Wheres That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock
          python publish_updates.py --repo /tmp/wheresthatstock --message "chore: update accessories snapshot" --accessories accesorios_snapshot.json --source accessories
