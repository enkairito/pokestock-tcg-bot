name: Check Pokémon TCG Stock

on:
  schedule:
    # Every hour, all day (no overnight pause).
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo (no solo el último commit): restock_stats.py
          # camina los commits recientes de state.json para reconstruir
          # cuántas veces ha restockeado cada producto en la última semana.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
          AMAZON_UK_COOKIES_JSON: ${{ secrets.AMAZON_UK_COOKIES_JSON }}
          AMAZON_US_COOKIES_JSON: ${{ secrets.AMAZON_US_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi
          if [ -n "$AMAZON_UK_COOKIES_JSON" ]; then
            echo "$AMAZON_UK_COOKIES_JSON" > amazon_cookies_uk.json
          fi
          if [ -n "$AMAZON_US_COOKIES_JSON" ]; then
            echo "$AMAZON_US_COOKIES_JSON" > amazon_cookies_us.json
          fi

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python check_stock.py

      - name: Run One Piece TCG check
        env:
          # check_stock.py (importado por check_onepiece.py) requiere estas
          # dos al cargarse, aunque los avisos reales de One Piece usan las
          # otras dos de abajo (bot y canal propios).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ONEPIECE_BOT_TOKEN: ${{ secrets.TELEGRAM_ONEPIECE_BOT_TOKEN }}
          TELEGRAM_ONEPIECE_CHAT_ID: ${{ secrets.TELEGRAM_ONEPIECE_CHAT_ID }}
        run: xvfb-run -a python check_onepiece.py

      - name: Run Magic TCG check
        env:
          # Igual que One Piece: check_stock.py requiere estas dos al
          # cargarse, aunque las alertas reales de Magic usan el bot/canal
          # propio de abajo. TELEGRAM_MAGIC_BOT_TOKEN/CHAT_ID aún no existen
          # como secrets (pendiente de crear el bot) — el scraping y la
          # publicación a la web funcionan igual mientras tanto, las
          # alertas de Telegram simplemente no harán nada hasta que se
          # añadan.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MAGIC_BOT_TOKEN: ${{ secrets.TELEGRAM_MAGIC_BOT_TOKEN }}
          TELEGRAM_MAGIC_CHAT_ID: ${{ secrets.TELEGRAM_MAGIC_CHAT_ID }}
        run: xvfb-run -a python check_magic.py

      - name: Compute restock stats
        run: python restock_stats.py

      - name: Publish products snapshot to Where's That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          if [ -f products_snapshot.json ]; then
            git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock

            cp products_snapshot.json /tmp/wheresthatstock/products.json

            if [ -f events.json ]; then
              cp events.json /tmp/wheresthatstock/events.json
            fi

            if [ -f restock_stats.json ]; then
              cp restock_stats.json /tmp/wheresthatstock/restock_stats.json
            fi

            if [ -f magic_snapshot.json ]; then
              cp magic_snapshot.json /tmp/wheresthatstock/magic.json
            fi

            if [ -f onepiece_snapshot.json ]; then
              cp onepiece_snapshot.json /tmp/wheresthatstock/onepiece.json
            fi

            if [ -f accesorios_onepiece_snapshot.json ]; then
              python merge_accesorios.py --base /tmp/wheresthatstock/accesorios.json --new accesorios_onepiece_snapshot.json --out /tmp/wheresthatstock/accesorios.json --tag "One Piece"
            fi

            python update_sitemap_lastmod.py --sitemap /tmp/wheresthatstock/sitemap.xml

            cd /tmp/wheresthatstock
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add products.json onepiece.json accesorios.json sitemap.xml events.json restock_stats.json
            # magic.json aparte (no incondicional): en la primerísima
            # ejecución todavía no existe ni en el working tree ni en un
            # commit anterior, y "git add" sobre una ruta que no existe en
            # ningún sitio aborta TODO el comando (no solo esa ruta).
            if [ -f magic.json ]; then
              git add magic.json
            fi
            if git diff --cached --quiet; then
              echo "No changes to publish"
            else
              git commit -m "chore: update products snapshot"
              for i in 1 2 3; do
                git push && break
                echo "Push rejected, pulling and retrying ($i/3)..."
                git pull --rebase
              done
            fi
          fi

#      - name: Upload debug artifacts
 #       if: always()
        #uses: actions/upload-artifact@v4
        #with:
          #name: debug-store-page
          #path: debug/
          #retention-days: 3
          #if-no-files-found: ignore

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json state_onepiece.json events.json
          if [ -f state_magic.json ]; then
            git add state_magic.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stock state"
            for i in 1 2 3; do
              git push && break
              echo "Push rejected, pulling and retrying ($i/3)..."
              git pull --rebase
            done
          fi
