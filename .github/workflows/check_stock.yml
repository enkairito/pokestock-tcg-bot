name: Check Pokémon TCG Stock

on:
  # Sin "schedule:" a propósito — GitHub lo retrasaba o se lo saltaba bajo
  # carga (ver scheduler-worker/README.md). El disparo real cada hora en el
  # minuto :17 lo hace el Cloudflare Worker de scheduler-worker/ vía este
  # workflow_dispatch.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo (no solo el último commit): restock_stats.py
          # camina los commits recientes de state.json para reconstruir
          # cuántas veces ha restockeado cada producto en la última semana.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
          AMAZON_UK_COOKIES_JSON: ${{ secrets.AMAZON_UK_COOKIES_JSON }}
          AMAZON_US_COOKIES_JSON: ${{ secrets.AMAZON_US_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi
          if [ -n "$AMAZON_UK_COOKIES_JSON" ]; then
            echo "$AMAZON_UK_COOKIES_JSON" > amazon_cookies_uk.json
          fi
          if [ -n "$AMAZON_US_COOKIES_JSON" ]; then
            echo "$AMAZON_US_COOKIES_JSON" > amazon_cookies_us.json
          fi

      - name: Restore Fnac cookies
        env:
          FNAC_COOKIES_JSON: ${{ secrets.FNAC_COOKIES_JSON }}
        run: |
          if [ -n "$FNAC_COOKIES_JSON" ]; then
            echo "$FNAC_COOKIES_JSON" > fnac_cookies.json
          fi

      - name: Restore GAME cookies
        env:
          GAME_COOKIES_JSON: ${{ secrets.GAME_COOKIES_JSON }}
        run: |
          if [ -n "$GAME_COOKIES_JSON" ]; then
            echo "$GAME_COOKIES_JSON" > game_cookies.json
          fi

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python check_stock.py

      - name: Commit updated state
        run: >-
          python publish_updates.py --repo . --message "chore: update stock state" --copy state.json state.json --copy events.json events.json

      - name: Compute restock stats
        run: python restock_stats.py

      - name: Publish products snapshot to Wheres That Stock
        env:
          WHERESTHATSTOCK_TOKEN: ${{ secrets.WHERESTHATSTOCK_TOKEN }}
        run: |
          git clone https://x-access-token:${WHERESTHATSTOCK_TOKEN}@github.com/enkairito/wheresthatstock.git /tmp/wheresthatstock
          python publish_updates.py --repo /tmp/wheresthatstock --message "chore: update stock snapshot" --copy products_snapshot.json products.json --sitemap --copy events.json events.json --copy restock_stats.json restock_stats.json
