name: Check Pokémon TCG Stock

on:
  schedule:
    # Every 30 min, paused 2:00-6:00 Spain time (CEST, UTC+2). GitHub
    # Actions cron has no timezone/DST support, so this needs manual
    # adjustment when Spain switches to CET in late October: change
    # '4-23' to '0,5-23' (2:00-6:00 CET = 1:00-4:59 UTC).
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          patchright install --with-deps chromium

      - name: Restore Amazon cookies
        env:
          AMAZON_COOKIES_JSON: ${{ secrets.AMAZON_COOKIES_JSON }}
        run: |
          if [ -n "$AMAZON_COOKIES_JSON" ]; then
            echo "$AMAZON_COOKIES_JSON" > amazon_cookies.json
          fi

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a python check_stock.py

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-store-page
          path: debug/
          retention-days: 3
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update stock state"
            git push
          fi
