name: Tests

on:
  push:
    paths: ['**/*.py', 'requirements.txt', '.github/workflows/**']
  pull_request:
    paths: ['**/*.py', 'requirements.txt', '.github/workflows/**']

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -B -m unittest discover -s tests -v
